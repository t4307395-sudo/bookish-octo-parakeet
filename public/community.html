<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الساحة العامة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links"><a href="index.html">⟵ رجوع</a></div>

  <div class="card">
    <h1>💬 الساحة العامة</h1>
    <p class="subtitle">دردشة مفتوحة لكل الطلاب. أي حد يقدر يقرأ، لازم تسجل دخول عشان تكتب.</p>

    <div class="chat-box" id="chatBox"></div>
    <div class="chat-form">
      <input type="text" id="chatInput" placeholder="اكتب رسالة...">
      <button id="chatSend">إرسال</button>
    </div>
    <p class="error" id="chatErr" style="display:none"></p>
  </div>
</div>

<script>
let chatSince = 0;
let isLoggedIn = false;

async function checkAuth() {
  const res = await fetch('/api/auth/me');
  const data = await res.json().catch(() => ({ user: null }));
  isLoggedIn = !!data.user;
  if (!isLoggedIn) {
    document.getElementById('chatInput').placeholder = 'سجّل دخول الأول عشان تكتب';
  }
}

async function loadChat() {
  const res = await fetch(`/api/chat/global/global?since=${chatSince}`);
  const data = await res.json();
  if (!res.ok || !data.messages) return;
  const box = document.getElementById('chatBox');
  const wasAtBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 10;
  data.messages.forEach((m) => {
    chatSince = Math.max(chatSince, m.created_at);
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = '<div class="who"></div><div class="txt"></div>';
    div.querySelector('.who').textContent = m.name;
    div.querySelector('.txt').textContent = m.text;
    box.appendChild(div);
  });
  if (wasAtBottom) box.scrollTop = box.scrollHeight;
}

document.getElementById('chatSend').addEventListener('click', send);
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});

async function send() {
  const err = document.getElementById('chatErr');
  err.style.display = 'none';
  if (!isLoggedIn) {
    err.textContent = 'لازم تسجل دخول عشان تكتب في الساحة العامة';
    err.style.display = 'block';
    return;
  }
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const res = await fetch('/api/chat/global/global', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    err.textContent = data.error || 'حصل خطأ';
    err.style.display = 'block';
    return;
  }
  loadChat();
}

checkAuth();
loadChat();
setInterval(loadChat, 3000);
</script>
</body>
</html>
