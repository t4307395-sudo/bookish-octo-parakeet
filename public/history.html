<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل اختباراتي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links"><a href="index.html">⟵ رجوع</a></div>

  <div class="card">
    <h1>🗂️ سجل اختباراتي</h1>
    <p class="subtitle">كل الاختبارات التنافسية اللي خلصتها وأنت داخل بحساب مسجل.</p>
    <p class="error" id="err" style="display:none"></p>
  </div>

  <div id="list"><p class="pending">جاري التحميل...</p></div>
</div>

<script>
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
}

async function load() {
  const list = document.getElementById('list');
  const res = await fetch('/api/history');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    list.innerHTML = '';
    const err = document.getElementById('err');
    err.textContent = data.error || 'حصل خطأ';
    err.style.display = 'block';
    return;
  }

  list.innerHTML = '';
  if (!data.history || data.history.length === 0) {
    list.innerHTML = '<div class="card"><p class="pending">لسه ملعبتش أي اختبار وأنت داخل بحساب</p></div>';
    return;
  }

  data.history.forEach((h) => {
    const row = document.createElement('div');
    row.className = 'result-row';

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = `${h.title} · ${fmtDate(h.finished_at)}`;

    const score = document.createElement('span');
    score.className = 'score';
    score.textContent = `${h.score}/${h.total_questions}`;

    row.append(name, score);
    list.appendChild(row);
  });
}
load();
</script>
  <script src="app-shell.js"></script>
</body>
</html>
