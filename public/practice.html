<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تدريب حر</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links"><a href="index.html">⟵ رجوع</a></div>

  <div class="card" id="setupBox">
    <h1>🎯 تدريب حر</h1>
    <p class="subtitle">اختار فئة وجاوب على قد ما تحب، من غير وقت ومن غير درجة نهائية. أي غلطة بتتسجل تلقائي في بنك أخطائك لو داخل بحساب.</p>

    <label>الفئة</label>
    <select id="categorySelect">
      <option value="">عام (كل الأسئلة)</option>
    </select>

    <label>عدد الأسئلة</label>
    <input type="number" id="countInput" value="10" min="1" max="50">

    <button id="startBtn">ابدأ التدريب</button>
    <p class="error" id="setupErr" style="display:none"></p>
  </div>

  <div class="card" id="quizBox" style="display:none">
    <p class="progress" id="progress"></p>
    <h2 id="qText"></h2>
    <div id="options"></div>
    <p class="hint"><a href="#" id="reportLink">🚩 أبلغ عن مشكلة في السؤال ده</a></p>
  </div>

  <div class="card" id="doneBox" style="display:none">
    <h2>🎉 خلصت الجولة!</h2>
    <p id="summary"></p>
    <button id="againBtn">جولة تانية</button>
  </div>
</div>

<script>
let questions = [];
let current = 0;
let correctCount = 0;

async function loadCategories() {
  try {
    const res = await fetch('/api/practice/categories');
    const data = await res.json().catch(() => ({ categories: [] }));
    if (!res.ok) throw new Error(data.error || 'تعذر تحميل الفئات');
    const select = document.getElementById('categorySelect');
    (data.categories || []).forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c.name;
      opt.textContent = `${c.name} (${c.count} سؤال)`;
      select.appendChild(opt);
    });
  } catch (error) {
    const err = document.getElementById('setupErr');
    err.textContent = error.message || 'تعذر تحميل فئات الأسئلة. حاول مرة أخرى.';
    err.style.display = 'block';
  }
}
loadCategories();

document.getElementById('startBtn').addEventListener('click', startRound);
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('doneBox').style.display = 'none';
  document.getElementById('setupBox').style.display = 'block';
});

async function startRound() {
  const err = document.getElementById('setupErr');
  err.style.display = 'none';
  const category = document.getElementById('categorySelect').value;
  const count = document.getElementById('countInput').value;

  const params = new URLSearchParams({ count });
  if (category) params.set('category', category);
  try {
    const res = await fetch(`/api/practice?${params}`);
    const data = await res.json().catch(() => ({ questions: [] }));
    if (!res.ok) throw new Error(data.error || 'تعذر تحميل الأسئلة');

    if (!data.questions || data.questions.length === 0) {
      err.textContent = 'لا توجد أسئلة كافية حاليًا لهذه الفئة. جرّب فئة أخرى أو قلّل العدد.';
      err.style.display = 'block';
      return;
    }

    questions = data.questions;
    err.style.display = 'none';
  } catch (error) {
    err.textContent = error.message || 'تعذر بدء التدريب. تأكد من اتصال قاعدة البيانات وحاول مرة أخرى.';
    err.style.display = 'block';
    return;
  }

  current = 0;
  correctCount = 0;
  document.getElementById('setupBox').style.display = 'none';
  document.getElementById('quizBox').style.display = 'block';
  document.getElementById('doneBox').style.display = 'none';
  renderQuestion();
}

document.getElementById('reportLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const q = questions[current];
  if (!q) return;
  await fetch(`/api/questions/${q.id}/report`, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ reason: 'بلاغ من صفحة التدريب الحر' }),
  });
  e.target.textContent = '✅ اتبعت البلاغ، شكراً';
});

function renderQuestion() {
  const q = questions[current];
  document.getElementById('reportLink').textContent = '🚩 أبلغ عن مشكلة في السؤال ده';
  document.getElementById('progress').textContent = `سؤال ${current + 1} من ${questions.length}`;
  document.getElementById('qText').textContent = q.text;

  const optionsBox = document.getElementById('options');
  optionsBox.innerHTML = '';
  ['a', 'b', 'c', 'd'].forEach((opt) => {
    const val = q['option_' + opt];
    if (!val) return;
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = val;
    btn.addEventListener('click', () => submitAnswer(opt, btn));
    optionsBox.appendChild(btn);
  });
}

async function submitAnswer(opt, btn) {
  document.querySelectorAll('#options .option-btn').forEach((b) => b.disabled = true);
  const res = await fetch('/api/practice/check', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ question_id: questions[current].id, selected_option: opt }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    document.querySelectorAll('#options .option-btn').forEach((b) => b.disabled = false);
    btn.style.background = '';
    const err = document.getElementById('setupErr');
    err.textContent = data.error || 'تعذر تسجيل الإجابة. حاول مرة أخرى.';
    err.style.display = 'block';
    return;
  }
  if (data.correct) {
    correctCount++;
    btn.style.background = 'rgba(0,210,168,0.25)';
  } else {
    btn.style.background = 'rgba(255,84,112,0.25)';
  }

  setTimeout(() => {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      document.getElementById('quizBox').style.display = 'none';
      document.getElementById('doneBox').style.display = 'block';
      document.getElementById('summary').textContent = `جاوبت صح في ${correctCount} من ${questions.length}`;
    }
  }, 700);
}
</script>
  <script src="app-shell.js"></script>
</body>
</html>
