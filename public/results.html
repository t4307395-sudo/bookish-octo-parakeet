<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النتائج</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="title">النتائج</h1>
    <p class="pending" id="status">جاري تحميل النتائج...</p>
    <div id="list"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button id="challengeBtn" style="display:none; width:auto; margin-top:14px;">تحدي صديقك على نفس الأسئلة 🔥</button>
      <button id="csvBtn" style="display:none; width:auto; margin-top:14px;" class="secondary">⬇️ تصدير النتائج CSV</button>
      <button id="analyticsBtn" style="display:none; width:auto; margin-top:14px;" class="secondary">📊 تحليل الأسئلة</button>
    </div>
    <div class="invite-box" id="challengeBox" style="display:none"></div>
    <div id="analyticsBox" style="display:none; margin-top:14px;"></div>
  </div>

  <div class="card">
    <h1 style="font-size:1.1rem">دردشة المتنافسين</h1>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-form">
      <input type="text" id="chatInput" placeholder="اكتب رسالة... (لازم تسجل دخول)">
      <button id="chatSend">إرسال</button>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const quizId = params.get('quiz');
const me = params.get('me');
let poll;
let lastParticipants = [];
let lastQuizTitle = '';

async function load() {
  const res = await fetch(`/api/quizzes/${quizId}/results`);
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('status').textContent = data.error || 'خطأ';
    return;
  }

  lastParticipants = data.participants;
  lastQuizTitle = data.quiz_title;

  document.getElementById('title').textContent = `النتائج: ${data.quiz_title}`;
  document.getElementById('status').textContent = data.all_finished
    ? '✅ كل المتنافسين خلصوا - دي النتيجة النهائية'
    : '⏳ في متنافسين لسه بيحلوا... النتائج هتتحدث تلقائي';

  const list = document.getElementById('list');
  list.innerHTML = '';
  data.participants.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'result-row' + (p.id === me ? ' me' : '');
    const finished = p.finished_at !== null;

    const rankSpan = document.createElement('span');
    rankSpan.className = 'rank';
    rankSpan.textContent = finished ? '#' + (i + 1) : '—';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    // اسم اللاعب إدخال مستخدم، فبيتحط بـ textContent مش innerHTML
    // عشان نمنع أي حقن HTML/JS (XSS) لو حد كتب اسمه بشكل خبيث.
    nameSpan.textContent = p.name + (p.id === me ? ' (انت)' : '');

    const statusSpan = document.createElement('span');
    statusSpan.className = finished ? 'score' : 'pending';
    statusSpan.textContent = finished
      ? `${p.score}/${p.total_questions} · ${p.time_taken_seconds}ث`
      : 'بيحل دلوقتي...';

    row.append(rankSpan, nameSpan, statusSpan);
    list.appendChild(row);
  });

  if (data.all_finished) clearInterval(poll);

  if (me) {
    document.getElementById('challengeBtn').style.display = 'inline-block';
  }
  if (data.participants.length > 0) {
    document.getElementById('csvBtn').style.display = 'inline-block';
    document.getElementById('analyticsBtn').style.display = 'inline-block';
  }
}

document.getElementById('challengeBtn').addEventListener('click', async () => {
  const res = await fetch('/api/challenges', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ participant_id: me }),
  });
  const data = await res.json();
  if (!res.ok) return;
  const box = document.getElementById('challengeBox');
  box.style.display = 'block';
  box.textContent = location.origin + data.invite_url;
});

// تصدير النتائج كملف CSV بيتفتح مباشرة في Excel/Google Sheets - مفيد
// للمعلم عشان يحتفظ بدرجات الطلاب أو يرفعها في سجل تقييم رسمي.
document.getElementById('csvBtn').addEventListener('click', () => {
  const rows = [['الاسم', 'الدرجة', 'من', 'الوقت (ثانية)', 'الحالة']];
  lastParticipants.forEach((p) => {
    const finished = p.finished_at !== null;
    rows.push([
      p.name,
      finished ? p.score : '',
      p.total_questions,
      finished ? p.time_taken_seconds : '',
      finished ? 'خلص' : 'لسه بيحل',
    ]);
  });
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  // \uFEFF (BOM) عشان Excel يفتح العربي صح من غير ما يتحول لرموز غريبة.
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `نتائج-${lastQuizTitle || quizId}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

// تحليل نسبة الإجابة الصح لكل سؤال - بيساعد المعلم يكتشف الأسئلة الملغومة
// (نسبة صح منخفضة جداً بشكل غير متوقع) أو السهلة جداً.
let analyticsLoaded = false;
document.getElementById('analyticsBtn').addEventListener('click', async () => {
  const box = document.getElementById('analyticsBox');
  if (analyticsLoaded) {
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
    return;
  }
  box.style.display = 'block';
  box.innerHTML = '<p class="pending">جاري التحميل...</p>';
  const res = await fetch(`/api/quizzes/${quizId}/analytics`);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    box.innerHTML = `<p class="error">${data.error || 'حصل خطأ'}</p>`;
    return;
  }
  analyticsLoaded = true;
  box.innerHTML = '';
  data.questions.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'result-row';
    const rate = q.correct_rate === null ? '—' : `${q.correct_rate}%`;
    const color = q.correct_rate === null ? 'var(--muted)'
      : q.correct_rate < 40 ? 'var(--danger)'
      : q.correct_rate < 70 ? '#e2b93b'
      : 'var(--accent2)';
    row.innerHTML = `<span class="rank">س${i + 1}</span><span class="name"></span><span class="score" style="color:${color}">${rate} صح</span>`;
    row.querySelector('.name').textContent = q.text;
    box.appendChild(row);
  });
});

// دردشة بسيطة بين المتنافسين على نفس الاختبار (polling)
let chatSince = 0;
async function loadChat() {
  const res = await fetch(`/api/chat/quiz/${quizId}?since=${chatSince}`);
  const data = await res.json();
  if (!res.ok || !data.messages) return;
  const box = document.getElementById('chatBox');
  data.messages.forEach((m) => {
    chatSince = Math.max(chatSince, m.created_at);
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = '<div class="who"></div><div class="txt"></div>';
    div.querySelector('.who').textContent = m.name;
    div.querySelector('.txt').textContent = m.text;
    box.appendChild(div);
  });
  if (data.messages.length) box.scrollTop = box.scrollHeight;
}
document.getElementById('chatSend').addEventListener('click', async () => {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const res = await fetch(`/api/chat/quiz/${quizId}`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  if (res.ok) loadChat();
});

load();
loadChat();
poll = setInterval(load, 3000);
setInterval(loadChat, 3000);
</script>
  <script src="app-shell.js"></script>
</body>
</html>
