<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الصدارة</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links"><a href="index.html">⟵ رجوع</a></div>

  <div class="card">
    <h1>🏆 لوحة الصدارة</h1>
    <p class="subtitle" id="periodHint">إجمالي نقاط كل طالب عبر كل الاختبارات اللي حلها (النقاط بتتحسب بس للطلاب اللي داخلين بحساب مسجل).</p>

    <div class="nav-links" style="margin-bottom:14px;">
      <a href="#" class="period-tab active" data-period="all">كل الوقت</a>
      <a href="#" class="period-tab" data-period="week">آخر أسبوع</a>
      <a href="#" class="period-tab" data-period="month">آخر شهر</a>
    </div>

    <label>فلترة حسب الصف/السنة (اختياري)</label>
    <input type="text" id="gradeFilter" placeholder="مثال: تالتة ثانوي">
    <button id="filterBtn">فلترة</button>
  </div>

  <div class="card">
    <div id="list"><p class="pending">جاري التحميل...</p></div>
  </div>
</div>

<script>
let currentPeriod = 'all';
const periodHints = {
  all: 'إجمالي نقاط كل طالب عبر كل الاختبارات اللي حلها (النقاط بتتحسب بس للطلاب اللي داخلين بحساب مسجل).',
  week: 'نقاط الاختبارات اللي خلصتها في آخر 7 أيام بس.',
  month: 'نقاط الاختبارات اللي خلصتها في آخر 30 يوم بس.',
};

async function load() {
  const grade = document.getElementById('gradeFilter').value.trim();
  const list = document.getElementById('list');
  list.innerHTML = '<p class="pending">جاري التحميل...</p>';
  document.getElementById('periodHint').textContent = periodHints[currentPeriod];

  const params = new URLSearchParams({ period: currentPeriod });
  if (grade) params.set('grade', grade);
  const res = await fetch(`/api/leaderboard?${params}`);
  const data = await res.json().catch(() => ({ students: [] }));

  list.innerHTML = '';
  if (!data.students || data.students.length === 0) {
    list.innerHTML = '<p class="pending">مفيش نتائج لسه في الفترة دي</p>';
    return;
  }

  data.students.forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'result-row';

    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = '#' + (i + 1);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = s.name + (s.grade ? ` (${s.grade})` : '');

    const score = document.createElement('span');
    score.className = 'score';
    score.textContent = `${s.points} نقطة`;

    row.append(rank, name, score);
    list.appendChild(row);
  });
}

document.querySelectorAll('.period-tab').forEach((tab) => {
  tab.addEventListener('click', (e) => {
    e.preventDefault();
    document.querySelectorAll('.period-tab').forEach((t) => t.classList.remove('active'));
    tab.classList.add('active');
    currentPeriod = tab.dataset.period;
    load();
  });
});

document.getElementById('filterBtn').addEventListener('click', load);
load();
</script>
  <script src="app-shell.js"></script>
</body>
</html>
