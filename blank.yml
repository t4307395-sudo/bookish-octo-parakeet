name: Auto Unzip Any File

on:
  push:
    paths:
      - '**.zip' # يعمل تلقائياً عند رفع م
  workflow_dispatch: # 👈 هذا السطر يضيف زر تشغيل يدوي للملف المرفوع س

permissions:
  contents: write

jobs:
  unzip-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and Unzip any ZIP file
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف مضغوط في المجلد الرئيسي!"
            exit 1
          fi
          
          echo "📂 جاري فك ضغط: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./
          rm "$ZIP_FILE"

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated: Unzipped website files" || echo "No changes to commit"
          git push
