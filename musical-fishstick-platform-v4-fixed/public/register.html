<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎓 إنشاء حساب</h1>
    <p class="subtitle">اعمل حسابك عشان نقاطك تتحسب في لوحة الصدارة العامة.</p>

    <label>الاسم</label>
    <input type="text" id="name" placeholder="اسمك بالكامل">

    <label>الإيميل</label>
    <input type="text" id="email" placeholder="you@example.com">

    <label>الباسورد (8 حروف على الأقل)</label>
    <input type="password" id="password" placeholder="********">

    <label>الصف/السنة الدراسية (اختياري)</label>
    <input type="text" id="grade" placeholder="مثال: تالتة ثانوي">

    <button id="submitBtn">إنشاء الحساب</button>
    <div class="error" id="err" style="display:none"></div>
    <p class="hint" style="margin-top:14px;">عندك حساب بالفعل؟ <a href="login.html">سجل دخول</a></p>
  </div>
</div>

<script>
document.getElementById('submitBtn').addEventListener('click', async () => {
  const err = document.getElementById('err');
  err.style.display = 'none';

  const payload = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    grade: document.getElementById('grade').value.trim(),
  };

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإنشاء...';

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      err.textContent = data.error || 'حصل خطأ، حاول تاني';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'إنشاء الحساب';
      return;
    }
    window.location.href = data.role === 'admin' ? 'admin.html' : 'index.html';
  } catch (e) {
    err.textContent = 'تعذر الاتصال بالخادم';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
  }
});
</script>
</body>
</html>
