<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فصولي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links"><a href="index.html">⟵ رجوع</a></div>

  <div class="card">
    <h1>إنشاء فصل جديد</h1>
    <input type="text" id="newClassName" placeholder="اسم الفصل (مثلاً: الصف الأول الثانوي - كيمياء)">
    <button id="createBtn">إنشاء</button>
    <p class="error" id="createErr" style="display:none"></p>
  </div>

  <div class="card">
    <h1>الانضمام لفصل</h1>
    <input type="text" id="joinCode" placeholder="كود الفصل">
    <button id="joinBtn">انضمام</button>
    <p class="error" id="joinErr" style="display:none"></p>
  </div>

  <div id="classesList"></div>

  <div class="card" id="detailCard" style="display:none">
    <h1 id="detailTitle"></h1>
    <div class="invite-box" id="detailCode"></div>
    <p class="subtitle">لوحة صدارة الفصل</p>
    <div id="detailLeaderboard"></div>

    <p class="subtitle" style="margin-top:20px">دردشة الفصل</p>
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-form">
      <input type="text" id="chatInput" placeholder="اكتب رسالة...">
      <button id="chatSend">إرسال</button>
    </div>
  </div>
</div>

<script>
let currentClassId = null;
let chatSince = 0;
let chatPoll = null;

async function loadClasses() {
  const res = await fetch('/api/classes');
  const data = await res.json();
  const list = document.getElementById('classesList');
  list.innerHTML = '';
  (data.classes || []).forEach((c) => {
    const card = document.createElement('div');
    card.className = 'card';
    const h = document.createElement('h1');
    h.style.fontSize = '1.1rem';
    h.textContent = c.name;
    const btn = document.createElement('button');
    btn.textContent = 'فتح';
    btn.addEventListener('click', () => openClass(c.id, c.name, c.join_code));
    card.append(h, btn);
    list.appendChild(card);
  });
}

async function openClass(id, name, code) {
  currentClassId = id;
  chatSince = 0;
  document.getElementById('detailCard').style.display = 'block';
  document.getElementById('detailTitle').textContent = name;
  document.getElementById('detailCode').textContent = `كود الفصل: ${code}`;

  const res = await fetch(`/api/classes/${id}/leaderboard`);
  const data = await res.json();
  const box = document.getElementById('detailLeaderboard');
  box.innerHTML = '';
  (data.students || []).forEach((s, i) => {
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `<span class="rank">#${i + 1}</span><span class="name"></span><span class="score"></span>`;
    row.querySelector('.name').textContent = s.name;
    row.querySelector('.score').textContent = `${s.total_points} نقطة`;
    box.appendChild(row);
  });

  loadChat();
  if (chatPoll) clearInterval(chatPoll);
  chatPoll = setInterval(loadChat, 3000);
}

async function loadChat() {
  if (!currentClassId) return;
  const res = await fetch(`/api/chat/class/${currentClassId}?since=${chatSince}`);
  const data = await res.json();
  if (!res.ok || !data.messages) return;
  const box = document.getElementById('chatBox');
  data.messages.forEach((m) => {
    chatSince = Math.max(chatSince, m.created_at);
    const div = document.createElement('div');
    div.className = 'chat-msg';
    div.innerHTML = '<div class="who"></div><div class="txt"></div>';
    div.querySelector('.who').textContent = m.name;
    div.querySelector('.txt').textContent = m.text;
    box.appendChild(div);
  });
  if (data.messages.length) box.scrollTop = box.scrollHeight;
}

document.getElementById('createBtn').addEventListener('click', async () => {
  const name = document.getElementById('newClassName').value.trim();
  const res = await fetch('/api/classes', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name }),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('createErr').textContent = data.error;
    document.getElementById('createErr').style.display = 'block';
    return;
  }
  document.getElementById('newClassName').value = '';
  loadClasses();
});

document.getElementById('joinBtn').addEventListener('click', async () => {
  const join_code = document.getElementById('joinCode').value.trim();
  const res = await fetch('/api/classes/join', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ join_code }),
  });
  const data = await res.json();
  if (!res.ok) {
    document.getElementById('joinErr').textContent = data.error;
    document.getElementById('joinErr').style.display = 'block';
    return;
  }
  document.getElementById('joinCode').value = '';
  loadClasses();
});

document.getElementById('chatSend').addEventListener('click', async () => {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentClassId) return;
  input.value = '';
  await fetch(`/api/chat/class/${currentClassId}`, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ text }),
  });
  loadChat();
});

loadClasses();
</script>
</body>
</html>
