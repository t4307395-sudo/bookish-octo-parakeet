<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملتقى الطلاب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="nav-links">
    <a href="index.html">اختبار جديد</a>
    <a href="my-quizzes.html">اختباراتي</a>
    <a href="practice.html">تدريب حر</a>
    <a href="daily.html">سؤال اليوم</a>
    <a href="mistakes.html">بنك أخطائي</a>
    <a href="history.html">سجل اختباراتي</a>
    <a href="classes.html">فصولي</a>
    <a href="community.html">الساحة العامة</a>
    <a href="leaderboard.html">الصدارة العامة</a>
    <a href="#" id="logoutLink">خروج</a>
  </div>

  <div class="card" id="guestCard" style="display:none">
    <h1>ملتقى الطلاب</h1>
    <p class="subtitle">سجّل دخول عشان نقاطك وسلسلة أيامك تتحفظ وتقدر تشوف تقدمك.</p>
    <a href="login.html"><button>تسجيل الدخول</button></a>
  </div>

  <div id="userCard" style="display:none">
    <div class="card">
      <h1 id="hello">أهلاً 👋</h1>
      <p class="subtitle" id="levelLine"></p>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="xpNum">0</div><div class="lbl">XP</div></div>
        <div class="stat-box"><div class="num" id="levelNum">1</div><div class="lbl">المستوى</div></div>
        <div class="stat-box"><div class="num streak-flame" id="streakNum">🔥 0</div><div class="lbl">أيام متتالية</div></div>
        <div class="stat-box"><div class="num" id="pointsNum">0</div><div class="lbl">إجمالي النقاط</div></div>
      </div>
    </div>

    <div class="card">
      <h1>بنك أخطائي</h1>
      <p class="subtitle" id="mistakesCount">جاري التحميل...</p>
      <a href="mistakes.html"><button>راجع أخطائي</button></a>
    </div>

    <div class="card">
      <h1>فصولي</h1>
      <p class="subtitle" id="classesLine">جاري التحميل...</p>
      <a href="classes.html"><button>إدارة الفصول</button></a>
    </div>
  </div>
</div>

<script>
async function load() {
  const meRes = await fetch('/api/auth/me');
  const meData = await meRes.json();
  if (!meData.user) {
    document.getElementById('guestCard').style.display = 'block';
    return;
  }
  const u = meData.user;
  document.getElementById('userCard').style.display = 'block';
  document.getElementById('hello').textContent = `أهلاً ${u.name} 👋`;
  document.getElementById('levelLine').textContent = `المستوى ${u.level} · استمر عشان توصل للي بعده`;
  document.getElementById('xpNum').textContent = u.xp;
  document.getElementById('levelNum').textContent = u.level;
  document.getElementById('streakNum').textContent = `🔥 ${u.streak_count}`;
  document.getElementById('pointsNum').textContent = u.total_points;

  const mRes = await fetch('/api/mistakes');
  const mData = await mRes.json();
  document.getElementById('mistakesCount').textContent = mData.mistakes?.length
    ? `عندك ${mData.mistakes.length} سؤال محتاج مراجعة`
    : 'مفيش أخطاء لسه محتاجة مراجعة 🎉';

  const cRes = await fetch('/api/classes');
  const cData = await cRes.json();
  document.getElementById('classesLine').textContent = cData.classes?.length
    ? `أنت في ${cData.classes.length} فصل`
    : 'مش منضم لأي فصل لسه';
}

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = 'login.html';
});

load();
</script>
  <script src="app-shell.js"></script>
</body>
</html>
